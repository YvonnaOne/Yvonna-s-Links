<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yvonna One - Official Links</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121212;
            --bg-darker: #0c0c0c;
            --text-light: #f5f5f5;
            --text-muted: #aaaaaa;
            --accent-gold: #d4af37;
            --header-height: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
        }

        header {
            background-color: rgba(12, 12, 12, 0.95);
            height: var(--header-height);
            display: flex;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .logo {
            font-size: 1.8rem;
            color: var(--accent-gold);
        }

        .hero {
            min-height: 100vh;
            padding-top: calc(var(--header-height) + 40px);
            padding-bottom: 60px;
            display: flex;
            align-items: center;
            background: radial-gradient(circle, rgba(20,20,20,1) 0%, rgba(12,12,12,1) 100%);
        }

        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-image-container {
            margin-bottom: 25px;
        }

        .profile-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.3);
            border: 4px solid var(--accent-gold);
        }

        .hero-content h2 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--text-light);
        }

        .hero-content .subtitle {
            font-size: 1.1rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .hero-content p {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 35px auto;
        }

        .links-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background-color: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        footer {
            background-color: var(--bg-darker);
            padding: 30px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @media (max-width: 600px) {
            .profile-img {
                width: 170px;
                height: 170px;
            }

            .hero-content h2 {
                font-size: 2.2rem;
            }

            .link-btn {
                padding: 14px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-container">
            <h1 class="logo">Yvonna One</h1>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-container">
            <div class="hero-image-container">
                <img src="profile.jpg" alt="Yvonna One" class="profile-img">
            </div>
            <div class="hero-content">
                <h2>Yvonna One</h2>
                <div class="subtitle">Model & Content Creator</div>
                <p>Welcome to my official page. Connect with me on my platforms below.</p>
            </div>

            <div class="links-container">
                <a href="https://chaturbate.com/yvonnaone/" target="_blank" rel="noopener" class="link-btn">
                    Chaturbate (CB)
                </a>
                <a href="https://share.myfreecams.com/YvonnaOne" target="_blank" rel="noopener" class="link-btn">
                    MyFreeCams
                </a>
                <a href="https://stripchat.com/Yvonna_One/follow-me" target="_blank" rel="noopener" class="link-btn">
                    Stripchat
                </a>
                <a href="https://www.instagram.com/pammellow1/" target="_blank" rel="noopener" class="link-btn">
                    Instagram
                </a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Yvonna One. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
